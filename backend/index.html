        }

        // 3. ADD THIS NEW FUNCTION BELOW THE OTHERS
        function showMyWatchlist() {
            fetch('http://127.0.0.1:5000/watchlist/get')
                .then(res => res.json())
                .then(data => {
                    const display = document.getElementById('watchlist-display');
                    display.innerHTML = '<h2>My Watchlist:</h2>'; 
                    
                    if (data.length === 0) {
                        display.innerHTML += '<p>Your watchlist is currently empty.</p>';
                    } else {
                        data.forEach(movie => {
                            display.innerHTML += `
                                <div style="margin-bottom: 10px;">
                                    <strong>${movie.title}</strong>
                                </div>
                            `;
                        });
                    }
                });
        }
    </script>
