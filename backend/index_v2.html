<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Explorer</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .movie-card { border: 1px solid #ccc; padding: 10px; margin: 10px; width: 250px; display: inline-block; vertical-align: top; }
    </style>
</head>
<body>

    <h1>Movie Explorer</h1>

    <div style="margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="Enter movie title...">
        <button onclick="searchMovie()">Search</button>
    </div>

    <button onclick="showMyWatchlist()">Show My Watchlist</button>
    <div id="movie-list"></div>
    <div id="watchlist-display"></div>

    <script>
        // 1. SEARCH FUNCTION
        function searchMovie() {
            const query = document.getElementById('searchInput').value;
            fetch(`http://127.0.0.1:5000/search?q=${query}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('movie-list');
                const display = document.getElementById('watchlist-display');
                display.innerHTML = ''; // Clear watchlist view
                list.innerHTML = '<h2>Search Results:</h2>';
                
                data.forEach(movie => {
                    const div = document.createElement('div');
                    div.className = 'movie-card';
                    div.innerHTML = `
                        <h3>${movie.title}</h3>
                        <button onclick="addToWatchlist('${movie.title.replace(/'/g, "\\'")}', '${movie.poster}')">Add to Watchlist</button>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // 2. ADD TO WATCHLIST FUNCTION
        function addToWatchlist(title, poster) {
            fetch('http://127.0.0.1:5000/watchlist/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, poster: poster })
            })
            .then(res => res.json())
            .then(data => alert(data.message));
        }

        // 3. SHOW WATCHLIST FUNCTION
        function showMyWatchlist() {
            fetch('http://127.0.0.1:5000/watchlist/get')
            .then(res => res.json())
            .then(data => {
                const display = document.getElementById('watchlist-display');
                const list = document.getElementById('movie-list');
                list.innerHTML = ''; // Clear search results
                display.innerHTML = '<h2>My Watchlist:</h2>';
                
                if (data.length === 0) display.innerHTML += '<p>Your watchlist is empty.</p>';
                data.forEach(movie => {
                    display.innerHTML += `<p><strong>${movie.title}</strong></p>`;
                });
            });
        }
    </script>
</body>
</html>
